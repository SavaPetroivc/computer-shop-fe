<div class="info-wrapper">
  <h1>My Info</h1>
  <p class="info-subtitle">Update your personal details and password.</p>

  <form class="info-form" [formGroup]="profileForm" (ngSubmit)="save()">
    <mat-form-field class="basic-input" appearance="outline">
      <mat-label>First name</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>

    <mat-form-field class="basic-input" appearance="outline">
      <mat-label>Last name</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>

    <mat-form-field class="basic-input" appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
      <mat-error *ngIf="profileForm.controls.email.hasError('email')">
        Enter a valid email address.
      </mat-error>
    </mat-form-field>

    <mat-form-field class="basic-input" appearance="outline">
      <mat-label>Phone number</mat-label>
      <input matInput formControlName="contactPhone" />
    </mat-form-field>

    <mat-form-field class="basic-input" appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput type="password" formControlName="password" />
      <mat-hint>Leave empty to keep your current password.</mat-hint>
      <mat-error *ngIf="profileForm.controls.password.hasError('minlength')">
        Password must be at least 6 characters.
      </mat-error>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      type="submit"
      [disabled]="profileForm.invalid"
    >
      Save
    </button>
  </form>
</div>
