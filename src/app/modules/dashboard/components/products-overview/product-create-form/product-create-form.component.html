<div class="product-form" [formGroup]="productForm">
  <mat-form-field class="basic-input">
    <mat-label>Product name</mat-label>
    <input matInput placeholder="Name" formControlName="name" />
  </mat-form-field>
  <mat-form-field class="basic-input">
    <mat-label>Product price</mat-label>
    <input matInput type="number" placeholder="Name" formControlName="price" />
  </mat-form-field>
  <mat-form-field class="basic-input">
    <mat-label>Product quantity</mat-label>
    <input
      matInput
      placeholder="Quantity"
      type="number"
      formControlName="quantity"
    />
  </mat-form-field>
  <mat-form-field class="basic-input">
    <mat-label>Image URL</mat-label>
    <input
      matInput
      placeholder="https://example.com/image.jpg"
      formControlName="imageUrl"
    />
  </mat-form-field>
  <img
    *ngIf="productForm.value.imageUrl"
    [src]="productForm.value.imageUrl"
    alt="Preview"
    class="image-preview"
  />
  <button mat-raised-button color="primary" (click)="createOrUpdate()">Save</button>
</div>
