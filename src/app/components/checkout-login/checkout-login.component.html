<div class="checkout-login">
  <p class="checkout-login__hint">Please log in to continue with your order.</p>
  <form class="checkout-login__form" [formGroup]="loginForm" (ngSubmit)="login()">
    <mat-form-field appearance="outline" class="basic-input">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="basic-input">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" />
    </mat-form-field>
    <button mat-raised-button color="primary" type="submit">Log in</button>
  </form>
</div>
