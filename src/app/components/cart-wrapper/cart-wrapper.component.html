<mat-stepper [linear]="true" #stepper>
  <mat-step>
    <app-cart-overview></app-cart-overview>
    <p *ngIf="cartEmpty$ | async" class="empty-cart">Your cart is empty.</p>
    <button *ngIf="!(cartEmpty$ | async)" mat-button matStepperNext>
      Next
    </button>
  </mat-step>
  <mat-step *ngIf="showLoginStep" [completed]="loginStepCompleted">
    <app-checkout-login (loggedIn)="onLoggedIn()"></app-checkout-login>
  </mat-step>
  <mat-step>
    <app-order-delivery></app-order-delivery>
  </mat-step>
</mat-stepper>
